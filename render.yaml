services:
  - type: web
    name: sitegen-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python backend/run.py
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: sitegen-db
          property: connectionString

databases:
  - name: sitegen-db
    plan: free
    region: oregon
